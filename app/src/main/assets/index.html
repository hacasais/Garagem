<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RLTecAuto</title><meta name="theme-color" content="#102E2C">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0EE;--card:#FFFFFF;--ink:#151A19;--mut:#5A6462;--line:#D7DBD8;--pri:#102E2C;--pri2:#1A413E;--onpri:#F2F5F3;--warn:#8A5A12;--warnbg:#F2E6CC;--bad:#8C2B22;--badbg:#F3DAD6;--ok:#215C40;--okbg:#D9ECE1;--cut:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1110;--card:#151B1A;--ink:#E7ECE9;--mut:#8C9A96;--line:#273331;--pri:#4E9D93;--pri2:#5CB2A7;--onpri:#07201D;--warn:#D9A748;--warnbg:#302405;--bad:#DD7C70;--badbg:#341613;--ok:#6FC79B;--okbg:#102A1C}}
:root[data-theme="dark"]{--bg:#0C1110;--card:#151B1A;--ink:#E7ECE9;--mut:#8C9A96;--line:#273331;--pri:#4E9D93;--pri2:#5CB2A7;--onpri:#07201D;--warn:#D9A748;--warnbg:#302405;--bad:#DD7C70;--badbg:#341613;--ok:#6FC79B;--okbg:#102A1C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
.num{font-family:"JetBrains Mono","Space Grotesk",monospace;font-weight:600;margin:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:2px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);padding:12px 20px 12px 16px;font-weight:600;min-height:44px;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line);clip-path:none;border-radius:2px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;clip-path:none;border-radius:2px}
.btn.del{background:transparent;color:var(--bad);border:1.5px solid var(--bad);clip-path:none;border-radius:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.top h1{font-size:26px;display:flex;align-items:center;gap:10px}
.brand{width:30px;height:30px;flex:none;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:700 13px/1 "Space Grotesk",sans-serif;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,0 100%)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;background:#fff;color:#14181a;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:18px;letter-spacing:.06em}
.plate i{background:#1E3A5F;color:#fff;font-style:normal;font-size:10px;padding:2px 5px;display:flex;align-items:flex-end}
.plate b{padding:1px 10px;font-weight:600}
.veh{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:2px;padding:12px;margin-bottom:10px;cursor:pointer}.vtop{display:flex;gap:12px;align-items:center}.chev{font-size:26px;color:var(--mut)}.vsum{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.arow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;font-weight:500;font-size:14px}#bn{display:none;position:sticky;top:0;z-index:8;background:var(--badbg);color:var(--bad);padding:8px 12px;font-size:14px;text-align:center}
.thumb{width:60px;height:60px;border-radius:2px;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mut);font-size:24px}
.veh h2{font-size:19px}
.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;padding:0}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--pri);border-bottom-color:var(--pri)}
.hero{background:var(--pri);background-image:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);padding:18px 20px;display:flex;gap:14px;align-items:center}
.hero .num{font-size:44px;line-height:1}
.hero .thumb{background:rgba(255,255,255,.16);color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px}
.stat .num{font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:2px;padding:3px 9px;background:var(--line);letter-spacing:.01em}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos img{width:60px;height:60px;object-fit:cover;border-radius:2px;cursor:zoom-in;border:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 2px 10px rgba(0,0,0,.25);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);border-radius:2px;padding:14px 22px}
.sheet{position:fixed;inset:0;background:rgba(10,14,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet form,.sheet .box{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:10px 10px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--pri)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--ink)}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:2px;padding:10px 12px;min-height:44px;font-size:15px}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:28px 12px;border:1.5px dashed var(--line);border-radius:2px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}#lb img{max-width:96%;max-height:90%;border-radius:4px}
</style>
</head>
<body>
<div id="bn" role="alert"></div><main id="app"></main>
<div id="lb" onclick="this.style.display='none'"><img alt="Fotografia ampliada"></div>
<script>
const TYPES=["Revisão","Óleo e filtros","Pneus","Rotação de pneus","Travões","Bateria","Inspeção (IPO)","Seguro","Reparação","Alteração / extra","Lavagem / estética","Combustível","Outro"];
const ASSETS=true,PH={},removed=new Set();
let S={vehicles:[],sel:null,tab:"resumo"},LOAD="loading",lastJ="",meta={},q=Promise.resolve();
const cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort()):v);
const idb=new Promise((res,rej)=>{const r=indexedDB.open("garagem",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(store,mode);const o=fn(t.objectStore(store));t.oncomplete=()=>res(o&&o.result);t.onerror=t.onabort=()=>rej(t.error)})}
function banner(m,ok){const b=document.getElementById("bn");b.textContent=m;b.style.display=m?"block":"none";b.style.background=ok?"var(--okbg)":"var(--badbg)";b.style.color=ok?"var(--ok)":"var(--bad)"}
function save(){q=q.then(persist)}
async function persist(){
  if(LOAD!=="ok")return;
  try{
    const j=cj(S.vehicles);if(j===lastJ)return;
    await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=j;meta.changed=Date.now();await tx("kv","readwrite",s=>s.put(meta,"meta"));
    const used=new Set();S.vehicles.forEach(v=>{if(v.photo)used.add(v.photo);(v.records||[]).forEach(r=>(r.photos||[]).forEach(p=>used.add(p)))});
    const dead=Object.keys(PH).filter(k=>!used.has(k));
    if(dead.length){await tx("photos","readwrite",s=>{dead.forEach(k=>s.delete(k))});dead.forEach(k=>delete PH[k])}
    banner("");
  }catch(e){banner("Não foi possível guardar neste telemóvel. Exporta já uma cópia de segurança.")}
}
let fh=null;
const driveCfg=()=>Object.assign({folder:"https://drive.google.com/drive/u/1/folders/1CA01qCcL4z_J6ddXUPLAAjB7QeOZhciR",cid:"",name:"garagem-dados.json",on:false},meta.drive||{});
const folderId=u=>{u=String(u||"").trim();const m=u.match(/folders\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?m[1]:(/^[\w-]{20,}$/.test(u)?u:null)};
let gTok=null,gExp=0;
async function gToken(){
  const c=driveCfg();
  if(location.protocol==="file:")throw new Error("abre a app a partir de um endereço https (a Google não aceita ficheiros locais)");
  if(!c.cid)throw new Error("falta o Client ID");
  if(gTok&&Date.now()<gExp)return gTok;
  if(!window.google||!google.accounts)await new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=ok;s.onerror=()=>ko(new Error("sem internet"));document.head.appendChild(s)});
  return new Promise((ok,ko)=>{
    google.accounts.oauth2.initTokenClient({client_id:c.cid,scope:"https://www.googleapis.com/auth/drive",
      callback:r=>{if(r.error)ko(new Error(r.error));else{gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;ok(gTok)}},
      error_callback:e=>ko(new Error(e.type||"autorização recusada"))}).requestAccessToken({prompt:""});
  });
}
async function gApi(url,opt={}){const tk=await gToken();const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+tk,...(opt.headers||{})}});if(!r.ok)throw new Error("Drive "+r.status);return r}
async function driveFind(c){
  const fid=folderId(c.folder);if(!fid)throw new Error("link da pasta inválido");
  const q=encodeURIComponent("name='"+c.name.replace(/'/g,"\\'")+"' and '"+fid+"' in parents and trashed=false");
  const r=await gApi("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true");
  const f=(await r.json()).files||[];return{fid,id:f[0]&&f[0].id};
}
async function driveSave(){
  const c=driveCfg(),{fid,id}=await driveFind(c);
  const data=JSON.stringify({app:"garagem",version:1,saved:new Date().toISOString(),vehicles:S.vehicles,photos:PH});
  const base="https://www.googleapis.com/upload/drive/v3/files";
  const init=await gApi((id?base+"/"+id:base)+"?uploadType=resumable&supportsAllDrives=true",{method:id?"PATCH":"POST",headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"application/json"},body:JSON.stringify(id?{}:{name:c.name,parents:[fid]})});
  const loc=init.headers.get("Location");if(!loc)throw new Error("sem sessão de envio");
  const up=await fetch(loc,{method:"PUT",headers:{"Content-Type":"application/json"},body:data});if(!up.ok)throw new Error("envio "+up.status);
  meta.lastBackup=Date.now();try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(e){}
}
async function driveLoad(){const c=driveCfg(),{id}=await driveFind(c);if(!id)throw new Error("ficheiro não encontrado na pasta");return(await gApi("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media&supportsAllDrives=true")).json()}
async function applyData(j){Object.keys(PH).forEach(k=>delete PH[k]);Object.assign(PH,j.photos||{});S.vehicles=j.vehicles;S.sel=null;await tx("photos","readwrite",s=>{s.clear();Object.entries(PH).forEach(([k,v])=>s.put(v,k))});await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=cj(S.vehicles)}
async function autoBackup(){
  if(!S.vehicles.length)return;
  const dc=driveCfg();
  if(dc.on&&dc.cid){
    try{await driveSave();const n=new Date();banner("Guardado no Drive às "+n.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}),true);setTimeout(()=>banner(""),3000)}
    catch(e){banner("Não foi possível atualizar o Drive: "+e.message+". Podes tentar em Cópia → Enviar agora.")}
  }
  if(meta.auto!==true)return;
  const data=JSON.stringify({app:"garagem",version:1,saved:new Date().toISOString(),vehicles:S.vehicles,photos:PH});
  const stamp=()=>{meta.lastBackup=Date.now();tx("kv","readwrite",s=>s.put(meta,"meta")).catch(()=>{})};
  if(fh){
    try{
      if(await fh.queryPermission({mode:"readwrite"})!=="granted"&&await fh.requestPermission({mode:"readwrite"})!=="granted")throw 0;
      const w=await fh.createWritable();await w.write(data);await w.close();stamp();return;
    }catch(e){banner("Não consegui atualizar o ficheiro escolhido. Foi descarregada uma cópia nova.")}
  }
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="garagem-dados-"+today()+".json";document.body.appendChild(a);a.click();a.remove();stamp();
  }catch(e){banner("Não foi possível criar o ficheiro de cópia.")}
}
async function init(){
  try{
    S.vehicles=(await tx("kv","readonly",s=>s.get("vehicles")))||[];lastJ=cj(S.vehicles);
    meta=(await tx("kv","readonly",s=>s.get("meta")))||{};
    try{fh=(await tx("kv","readonly",s=>s.get("fh")))||null}catch(e){}
    const d=await idb;
    await new Promise(res=>{const c=d.transaction("photos").objectStore("photos").openCursor();c.onsuccess=()=>{const u=c.result;if(u){PH[u.key]=u.value;u.continue()}else res()};c.onerror=()=>res()});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    LOAD="ok";render();
  }catch(e){LOAD="off";render()}
}
const bkNote=()=>{if(!S.vehicles.length)return"";const lb=meta.lastBackup||0,pend=!lb||((meta.changed||0)>lb&&Date.now()-lb>7*864e5);return pend?`<div class="card" style="background:var(--warnbg)"><strong>Há alterações sem cópia de segurança</strong><div class="mut">${lb?"Última cópia: "+new Date(lb).toLocaleDateString("pt-PT"):"Ainda não guardaste nenhuma cópia."}</div><div class="acts" style="margin-top:8px"><button class="btn sm" onclick="backup()">Guardar cópia</button></div></div>`:""};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtKm=n=>(Number(n)||0).toLocaleString("pt-PT")+" km";
const fmtEur=n=>(Number(n)||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const fmtD=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-PT"):"";
const today=()=>new Date().toISOString().slice(0,10);
const cur=()=>S.vehicles.find(v=>v.id===S.sel);

function alertInfo(a,v){
  let days=a.date?Math.round((new Date(a.date+"T12:00")-new Date(today()+"T12:00"))/864e5):null;
  let kmL=a.km?Number(a.km)-Number(v.km||0):null;
  let lvl=0,txt=[];
  if(days!==null){txt.push(days<0?`há ${-days} dias`:days===0?"hoje":`em ${days} dias`);if(days<0)lvl=2;else if(days<=30)lvl=Math.max(lvl,1)}
  if(kmL!==null){txt.push(kmL<=0?`passou ${fmtKm(-kmL)}`:`faltam ${fmtKm(kmL)}`);if(kmL<=0)lvl=2;else if(kmL<=1000)lvl=Math.max(lvl,1)}
  return{lvl,days,kmL,txt:txt.join(" · "),score:lvl*1e6-(days??999)}
}
function render(){
  if(LOAD==="loading"){$("#app").innerHTML=`<div class="empty">A carregar a tua garagem…</div>`;return}
  if(LOAD==="off"){$("#app").innerHTML=`<div class="empty">Este browser não permite guardar dados locais.<br>Abre o ficheiro com o Chrome (Android) ou o Safari (iPhone), fora do modo privado.</div>`;return}
  save();
  const v=cur();
  $("#app").innerHTML=v?vehicleView(v):listView();
}
const src=p=>p?(PH[p]||""):"";
const thumb=v=>v.photo?`<img class="thumb" src="${src(v.photo)}" alt="">`:`<div class="thumb">🚗</div>`;
const near=(a,v)=>{const i=alertInfo(a,v);return((i.days!==null&&i.days<=60)||(i.kmL!==null&&i.kmL<=2000))?i:null};
const openV=id=>{S.sel=id;S.tab="resumo";render()};
function listView(){
  const n=S.vehicles.reduce((s,v)=>s+allAlerts(v).filter(a=>near(a,v)).length,0);
  return `<div class="top"><h1><span class="brand">RT</span>RLTecAuto</h1><button class="btn ghost sm" onclick="backup()">Cópia</button></div>
  ${bkNote()}
  ${n?`<p class="mut" style="margin:0 0 12px">${n} aviso${n>1?"s":""} nos próximos 2 meses (ou a menos de 2 000 km)</p>`:""}
  ${S.vehicles.length?S.vehicles.map(vcard).join(""):`<div class="empty">Ainda não tens nenhuma viatura.<br>Adiciona a primeira para começar a registar.</div>`}
  <button class="btn fab" onclick="editVeh()">+ Viatura</button>`;
}
function vcard(v){
  const l=allAlerts(v).map(a=>({a,i:near(a,v)})).filter(x=>x.i).sort((x,y)=>y.i.score-x.i.score);
  const yr=String(new Date().getFullYear()),cost=(v.records||[]).filter(r=>(r.date||"").startsWith(yr)).reduce((s,r)=>s+(Number(r.cost)||0),0);
  return `<div class="veh" role="button" tabindex="0" onclick="openV('${v.id}')" onkeydown="if(event.key==='Enter')openV('${v.id}')">
  <div class="vtop">${thumb(v)}<div style="flex:1;min-width:0"><h2>${esc(v.name)}</h2><div class="mut">${v.year?esc(v.year)+" · ":""}${fmtKm(v.km)} · ${fmtEur(cost)} em ${yr}</div>${v.plate?plate(v.plate):""}</div><span class="chev">›</span></div>
  <div class="vsum">${l.length?l.slice(0,3).map(x=>`<div class="arow"><span>${esc(x.a.title)}</span><span class="tag ${["ok","warn","bad"][x.i.lvl]}">${x.i.txt}</span></div>`).join("")+(l.length>3?`<div class="mut">+${l.length-3} mais</div>`:""):`<div class="mut">Sem avisos nos próximos 2 meses</div>`}</div></div>`;
}
const plate=p=>`<span class="plate" style="margin-top:6px"><i>P</i><b>${esc(p.toUpperCase())}</b></span>`;
function vehicleView(v){
  const tabs=[["resumo","Resumo"],["registos","Registos"],["avisos","Avisos"],["tecnico","Técnico"]];
  let body="";
  if(S.tab==="resumo")body=resumo(v);else if(S.tab==="registos")body=registos(v);else if(S.tab==="avisos")body=avisos(v);else body=tecnico(v);
  const fab=S.tab==="avisos"?`<button class="btn fab" onclick="editAlert()">+ Aviso</button>`:S.tab==="tecnico"?`<button class="btn fab" onclick="editTech()">+ Detalhe</button>`:`<button class="btn fab" onclick="editRec()">+ Registo</button>`;
  return `<div class="top"><button class="btn ghost sm" onclick="S.sel=null;render()">‹ Viaturas</button><button class="btn ghost sm" onclick="editVeh('${v.id}')">Editar</button></div>
  <div class="hero">${thumb(v)}<div><h1 style="font-size:26px">${esc(v.name)}</h1><div class="num">${(Number(v.km)||0).toLocaleString("pt-PT")} <span style="font-size:20px">km</span></div>${v.plate?plate(v.plate):""}</div></div>
  <div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.tab===t[0]}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${body}${fab}`;
}
function resumo(v){
  const r=v.records||[],tot=r.reduce((s,x)=>s+(Number(x.cost)||0),0);
  const yr=new Date().getFullYear(),ty=r.filter(x=>(x.date||"").startsWith(yr)).reduce((s,x)=>s+(Number(x.cost)||0),0);
  const al=allAlerts(v).map(a=>({a,i:alertInfo(a,v)})).sort((x,y)=>y.i.score-x.i.score).slice(0,3);
  const last=[...r].sort((a,b)=>b.date.localeCompare(a.date))[0];
  return `<div class="stats"><div class="stat"><div class="mut">Gasto total</div><div class="num">${fmtEur(tot)}</div></div><div class="stat"><div class="mut">Gasto em ${yr}</div><div class="num">${fmtEur(ty)}</div></div>

}

function editKm(){
  const v=cur(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const d=sheet(`<h2 style="font-size:19px">Atualizar quilómetros</h2>
  <button type="button" class="btn ghost sm" id="kmcam" style="width:100%;margin-top:8px">Abrir câmara e ler o quadrante</button>
  <p class="mut" id="kmhint" style="margin:6px 0 0">Enquadra só o número total (sem casas decimais).</p>
  <div id="kmbox" style="display:none;margin-top:8px"><div style="position:relative;overflow:hidden;border-radius:8px;background:#000;max-height:34vh"><video id="kmvid" autoplay playsinline muted style="width:100%;max-height:34vh;object-fit:cover;display:block"></video><div style="position:absolute;left:10%;right:10%;top:37%;height:26%;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none"></div></div>
  <div class="acts" style="margin-top:8px"><button type="button" class="btn sm" id="kmuse" disabled>Usar valor</button><button type="button" class="btn ghost sm" id="kmstop">Fechar câmara</button></div></div>
  <div id="kmmsg" class="mut" style="margin-top:6px;min-height:18px"></div>
  <label style="margin-top:10px">Quilómetros atuais</label><input name="km" type="number" inputmode="numeric" min="0" required value="${v.km||""}">
  <div class="acts"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div>`,
  f=>{const n=Number(f.get("km"))||0;if(n<(v.km||0)&&!confirm("O valor é inferior ao atual. Guardar mesmo assim?"))return;v.km=n});
  const $d=s=>d.querySelector(s),cam=$d("#kmcam"),box=$d("#kmbox"),vid=$d("#kmvid"),m=$d("#kmmsg"),inp=$d("[name=km]"),use=$d("#kmuse");
  let stream=null,worker=null,run=false;
  const stop=()=>{run=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(worker)worker.terminate().catch(()=>{});worker=null;box.style.display="none";cam.style.display=""};
  $d("#kmstop").onclick=stop;
  use.onclick=()=>{inp.value=use.dataset.v;stop();m.textContent="Valor "+fmtKm(Number(inp.value))+" preenchido. Confirma ou corrige e carrega em Guardar."};
  cam.onclick=async()=>{
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false})}
    catch(e){m.textContent="Não consegui abrir a câmara. Autoriza o acesso à câmara ou escreve o valor manualmente.";return}
    vid.srcObject=stream;box.style.display="block";cam.style.display="none";run=true;use.disabled=true;
    const iv=setInterval(()=>{if(!document.body.contains(d)){stop();clearInterval(iv)}},500);
    m.textContent="A preparar a leitura… (precisa de internet)";
    try{
      if(!window.Tesseract)await new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
      worker=await Tesseract.createWorker("eng");
      await worker.setParameters({tessedit_char_whitelist:"0123456789.",tessedit_pageseg_mode:"7"});
    }catch(e){m.textContent="Leitura automática indisponível (sem internet?). Vê o número na câmara e escreve-o abaixo.";return}
    const c=document.createElement("canvas"),cx=c.getContext("2d"),curKm=Number(v.km)||0;
    // Converte o recorte a preto e branco de alto contraste — ajuda muito em mostradores digitais/LCD.
    function bw(canvas){
      const cx2=canvas.getContext("2d"),id=cx2.getImageData(0,0,canvas.width,canvas.height),d=id.data;
      let sum=0;const n=d.length/4;
      for(let i=0;i<d.length;i+=4)sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      const mean=sum/n,invert=mean<110;
      for(let i=0;i<d.length;i+=4){
        let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        let v=g>mean?255:0;if(invert)v=255-v;
        d[i]=d[i+1]=d[i+2]=v;
      }
      cx2.putImageData(id,0,0);
    }
    try{
      while(run){
        const w=vid.videoWidth,h=vid.videoHeight;if(!w){await sleep(300);continue}
        c.width=w*.8;c.height=h*.26;cx.drawImage(vid,w*.1,h*.37,w*.8,h*.26,0,0,c.width,c.height);
        bw(c);
        const r=await worker.recognize(c);if(!run)break;
        // O odómetro parcial mostra casas decimais (ex.: 512.3); o total é sempre um número inteiro.
        // Ignoramos qualquer número com ponto decimal, para não confundir os dois.
        const tokens=r.data.text.match(/\d+\.\d+|\d+/g)||[];
        const nums=[...new Set(tokens.filter(t=>!t.includes(".")&&t.length>=4&&t.length<=7).map(Number))];
        const up=nums.filter(n=>n>=curKm).sort((a,b)=>a-b),pick=up.length?up[0]:nums.sort((a,b)=>b-a)[0];
        if(pick){use.dataset.v=pick;use.disabled=false;m.textContent="A ler: "+fmtKm(pick)+". Se estiver certo, toca em «Usar este valor»."}
        else m.textContent="A procurar o odómetro total… afasta o parcial (o dos decimais) de dentro da moldura, se possível.";
        await sleep(300);
      }
    }catch(e){if(run)m.textContent="A leitura falhou. Escreve o valor manualmente."}
  };
}

  <label>Categoria</label>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">${techCats().map(([v2,l])=>catRow(v2,l)).join("")}</div>
  <div class="row" style="align-items:baseline;margin-top:14px"><label style="margin:0">Campo</label><button type="button" class="btn ghost sm" style="padding:2px 10px;min-height:0" onclick="manageTechFields(document.querySelector('input[name=cat]:checked').value)">Gerir lista</button></div>
  <input name="label" required list="techlist" placeholder="Ex.: Óleo motor — capacidade (L)" value="${esc(x.label||"")}">
  <datalist id="techlist">${techFieldList(cat0).map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
  <label>Valor</label><input name="value" placeholder="Ex.: 4,3 L / 5W-30" value="${esc(x.value||"")}">
  <label>Nota (opcional — ex.: norma substituída, observações)</label><textarea name="note" rows="2">${esc(x.note||"")}</textarea>
  <div class="acts"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar</button></div>
  ${id?`<div class="acts"><button type="button" class="btn del" onclick="delTech('${id}')">Apagar</button></div>`:""}`,
  f=>{const label=(f.get("label")||"").trim();if(!label)return;
    const o=id?x:{id:uid()};Object.assign(o,{cat:f.get("cat")||"outro",label,value:(f.get("value")||"").trim(),note:(f.get("note")||"").trim()});
    if(!id)v.tech.push(o);});
}
function delTech(id){const v=cur();v.tech=(v.tech||[]).filter(t=>t.id!==id);document.querySelector(".sheet")?.remove();render()}
function doneAlert(id){const v=cur();if(id.startsWith('plan:')){const p=v.plan.find(x=>x.id===id.slice(5));editRec(null,{type:p.type});return}const a=v.alerts.find(x=>x.id===id);editRec(null,{type:TYPES.includes(a.title)?a.title:"Outro",notes:TYPES.includes(a.title)?"":a.title,fromAlert:id})}
const defPlan=()=>[["Revisão",15000,12],["Óleo e filtros",15000,12],["Rotação de pneus",10000,0],["Travões",30000,24],["Inspeção (IPO)",0,24],["Seguro",0,12]].map(([type,km,months])=>({id:uid(),type,km,months}));
function planAlerts(v){
  if(!v.plan)v.plan=defPlan();
  return v.plan.map(p=>{
    const rs=(v.records||[]).filter(r=>r.type===p.type).sort((a,b)=>b.date.localeCompare(a.date)||(b.km||0)-(a.km||0));
    let ld=p.lastDate||"",lk=Number(p.lastKm)||0;const r=rs[0];
    if(r&&(!ld||r.date>=ld)){ld=r.date;lk=Number(r.km)||0}
    let date="";if(Number(p.months)&&ld){const d=new Date(ld+"T12:00");d.setMonth(d.getMonth()+Number(p.months));date=d.toISOString().slice(0,10)}
    const km=Number(p.km)&&lk?lk+Number(p.km):0;
    return{id:"plan:"+p.id,title:p.type,derived:true,planId:p.id,date,km,none:!date&&!km};
  });
}
const allAlerts=v=>[...(v.alerts||[]),...planAlerts(v).filter(a=>!a.none)];
function baseTypes(){
  const removed=meta.typesRemoved||[],custom=meta.typesCustom||[];
  const out=TYPES.filter(t=>!removed.includes(t));
  custom.forEach(t=>{if(t&&!out.includes(t))out.push(t)});
  return out;
}
function allTypes(){
  const extra=[];
  S.vehicles.forEach(v=>{(v.plan||[]).forEach(p=>extra.push(p.type));(v.records||[]).forEach(r=>extra.push(r.type))});
  const out=[...baseTypes()];extra.forEach(t=>{if(t&&!out.includes(t))out.push(t)});return out;
}
function manageTypes(){
  document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const list=baseTypes();
  const d=sheet(`<h2>Gerir tipos de registo</h2><p class="mut">Esta lista é sugerida ao criar registos e intervenções do plano de manutenção, em todas as viaturas. Apagar um tipo aqui não apaga registos já criados com esse tipo.</p>
  ${list.length?list.map((t,i)=>`<div class="card"><div class="row"><strong>${esc(t)}</strong><button type="button" class="btn del sm" onclick="removeType(${i})">Apagar</button></div></div>`).join(""):`<div class="empty">Sem tipos definidos.</div>`}
  <label style="margin-top:14px">Adicionar tipo novo</label><div class="g2"><input id="newtype" placeholder="Ex.: Óleo do diferencial"><button type="button" class="btn" id="addtype">Adicionar</button></div>
  <div class="acts"><button type="button" class="btn ghost" data-close>Fechar</button></div>`,()=>{});
  d.querySelector("#addtype").onclick=async()=>{
    const val=(d.querySelector("#newtype").value||"").trim();if(!val)return;
    meta.typesRemoved=(meta.typesRemoved||[]).filter(x=>x!==val);
    meta.typesCustom=[...new Set([...(meta.typesCustom||[]),val])];
    try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(e){}
    manageTypes();
  };
}
async function removeType(i){
  const list=baseTypes(),t=list[i];if(t===undefined)return;
  meta.typesRemoved=[...new Set([...(meta.typesRemoved||[]),t])];
  meta.typesCustom=(meta.typesCustom||[]).filter(x=>x!==t);
  try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(e){}
  manageTypes();
}
function planSheet(){
  const v=cur();document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const pa=Object.fromEntries(planAlerts(v).map(a=>[a.planId,a]));
  sheet(`<h2>Plano de manutenção</h2><p class="mut">Define de quanto em quanto tempo ou km se faz cada intervenção. Os avisos calculam-se sozinhos a partir do último registo desse tipo. Os valores são sugestões: ajusta-os ao manual da tua viatura.</p>
  ${v.plan.map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.type)}</strong><div class="mut">${[p.km?"cada "+fmtKm(p.km):"",p.months?"cada "+p.months+" meses":""].filter(Boolean).join(" · ")||"Sem intervalo"}</div>${pa[p.id]&&pa[p.id].none?`<div class="mut">Sem histórico: regista a última vez ou indica-a ao editar.</div>`:""}</div><button type="button" class="btn ghost sm" onclick="editPlan('${p.id}')">Editar</button></div></div>`).join("")}
  <div class="acts"><button type="button" class="btn ghost" data-close>Fechar</button><button type="button" class="btn" onclick="editPlan()">+ Intervenção</button></div>`,()=>{});
}
function editPlan(id){
  const v=cur();document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const p=(v.plan||[]).find(x=>x.id===id)||{};
  const mode0=p.km&&p.months?"ambos":p.months?"meses":"km";
  const modeRow=(val,label)=>`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="radio" name="mode" value="${val}" ${mode0===val?"checked":""} style="width:20px;min-height:0" onchange="document.querySelectorAll('.pkm').forEach(e=>e.style.display=(this.value==='km'||this.value==='ambos')?'':'none');document.querySelectorAll('.pmo').forEach(e=>e.style.display=(this.value==='meses'||this.value==='ambos')?'':'none')"> ${label}</label>`;
  sheet(`<h2>${id?"Editar intervenção":"Nova intervenção"}</h2>
  <div class="row" style="align-items:baseline"><label style="margin:0">Nome da intervenção</label><button type="button" class="btn ghost sm" style="padding:2px 10px;min-height:0" onclick="manageTypes()">Gerir lista</button></div>
  <input name="type" required list="typelist" placeholder="Ex.: Óleo do diferencial" value="${esc(p.type||"")}">
  <datalist id="typelist">${allTypes().map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
  <label style="margin-top:14px">Controlar por</label>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">${modeRow("km","Quilómetros")}${modeRow("meses","Tempo")}${modeRow("ambos","Ambos")}</div>
  <div class="g2" style="margin-top:10px">
  <div class="pkm" style="display:${mode0==="meses"?"none":""}"><label>A cada (km)</label><input name="km" type="number" inputmode="numeric" min="0" value="${p.km||""}"></div>
  <div class="pmo" style="display:${mode0==="km"?"none":""}"><label>A cada (meses)</label><input name="months" type="number" inputmode="numeric" min="0" value="${p.months||""}"></div>
  </div>
  <p class="mut">Com "Ambos", o aviso dispara com o que chegar primeiro.</p>
  <label>Última vez (só se ainda não tens registo)</label><div class="g2"><input name="lastDate" type="date" value="${p.lastDate||""}"><input name="lastKm" type="number" inputmode="numeric" placeholder="km" value="${p.lastKm||""}"></div>
  <div class="acts"><button type="button" class="btn ghost" onclick="planSheet()">Cancelar</button><button class="btn">Guardar</button></div>
  ${id?`<div class="acts"><button type="button" class="btn del" onclick="delPlan('${id}')">Apagar intervenção</button></div>`:""}`,
  f=>{const mode=f.get("mode"),name=(f.get("type")||"").trim();if(!name)return;
    const km=mode!=="meses"?Number(f.get("km"))||0:0,months=mode!=="km"?Number(f.get("months"))||0:0;
    if(!km&&!months){alert("Indica km, meses ou ambos.");setTimeout(()=>editPlan(id),50);return}
    const o=id?p:{id:uid()};
    Object.assign(o,{type:name,km,months,lastDate:f.get("lastDate"),lastKm:Number(f.get("lastKm"))||0});
    if(!id){v.plan=v.plan||defPlan();v.plan.push(o)}setTimeout(planSheet,50)});
}
function delPlan(id){const v=cur();v.plan=v.plan.filter(p=>p.id!==id);render();planSheet()}
function zoom(s){const l=$("#lb");l.querySelector("img").src=s;l.style.display="grid"}
function backup(){
  const DC=driveCfg(),last=meta.lastBackup?new Date(meta.lastBackup).toLocaleDateString("pt-PT"):"nunca";
  const d=sheet(`<h2>Cópia de segurança</h2><p class="mut">Os dados e as fotografias ficam guardados neste telemóvel, dentro do browser. Uma página web não consegue atualizar um ficheiro que já existe no Android, por isso cada cópia é um ficheiro novo. Guarda uma cópia de vez em quando (por exemplo depois de uma revisão), copia-a para o Drive ou para o computador e apaga as antigas.</p>
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="au" ${meta.auto?"checked":""} style="width:22px;min-height:0"> Criar também um ficheiro a cada Guardar (não recomendado: cria muitos ficheiros)</label><p>Última cópia: <strong>${last}</strong></p>
  <h3 style="margin:14px 0 4px">Google Drive</h3>
  ${location.protocol==="file:"?`<p class="mut" style="color:var(--warn)">Atenção: a Google só aceita esta ligação se a app estiver aberta a partir de um endereço https (por exemplo alojada no Netlify ou no GitHub Pages). A partir de um ficheiro local não funciona.</p>`:""}
  <label>Link da pasta do Drive</label><input id="df" value="${esc(DC.folder)}" placeholder="https://drive.google.com/drive/folders/…">
  <label>Nome do ficheiro</label><input id="dn" value="${esc(DC.name)}">
  <label>Google Client ID</label><input id="dc" value="${esc(DC.cid)}" placeholder="xxxx.apps.googleusercontent.com">
  <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="do" ${DC.on?"checked":""} style="width:22px;min-height:0"> Atualizar o ficheiro no Drive a cada Guardar</label>
  <div class="acts"><button type="button" class="btn" id="dsv">Guardar configuração</button></div>
  <div class="acts"><button type="button" class="btn ghost" id="dup">Enviar agora</button><button type="button" class="btn ghost" id="ddn">Restaurar do Drive</button></div>
  <div id="dmsg" class="mut" style="margin-bottom:8px"></div>
  <h3 style="margin:14px 0 4px">Cópia em ficheiro</h3>
  ${window.showSaveFilePicker?`<div class="acts"><button type="button" class="btn ghost" id="lf">${fh?"Trocar ficheiro de cópia":"Escolher ficheiro único de cópia"}</button></div>${fh?`<p class="mut">Ficheiro ligado: ${esc(fh.name)}. Cada Guardar atualiza este ficheiro.</p>`:""}`:""}
  <div class="acts"><button type="button" class="btn" id="ex">Guardar / partilhar cópia</button></div>
  <label>Importar cópia (substitui os dados deste telemóvel)</label><input type="file" id="im" accept=".json,application/json">
  <div class="acts"><button type="button" class="btn ghost" data-close>Fechar</button></div>`,()=>{});
  const rd=()=>{meta.drive={folder:d.querySelector("#df").value.trim(),name:d.querySelector("#dn").value.trim()||"garagem-dados.json",cid:d.querySelector("#dc").value.trim(),on:d.querySelector("#do").checked};return tx("kv","readwrite",s=>s.put(meta,"meta"))};
  const dm=d.querySelector("#dmsg"),say=x=>{dm.textContent=x};
  d.querySelector("#dsv").onclick=async()=>{if(!folderId(d.querySelector("#df").value)){say("Link da pasta inválido.");return}await rd();say("Configuração guardada.")};
  d.querySelector("#dup").onclick=async()=>{try{if(!folderId(d.querySelector("#df").value))throw new Error("link da pasta inválido");await rd();say("A enviar…");await driveSave();say("Ficheiro atualizado no Drive.");render()}catch(e){say("Falhou: "+e.message)}};
  d.querySelector("#ddn").onclick=async()=>{try{if(!folderId(d.querySelector("#df").value))throw new Error("link da pasta inválido");await rd();say("A procurar no Drive…");const j=await driveLoad();if(j.app!=="garagem"||!Array.isArray(j.vehicles))throw new Error("ficheiro inválido");if(!confirm("Substituir os dados deste telemóvel pelos do Drive?"))return;await applyData(j);d.remove();render()}catch(e){say("Falhou: "+e.message)}};
  d.querySelector("#lf")?.addEventListener("click",async()=>{try{fh=await showSaveFilePicker({suggestedName:"garagem-dados.json",types:[{description:"Garagem",accept:{"application/json":[".json"]}}]});await tx("kv","readwrite",s=>s.put(fh,"fh"));d.remove();render();autoBackup()}catch(e){}});
  d.querySelector("#au").onchange=async e=>{meta.auto=e.target.checked;try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(x){}};
  d.querySelector("#ex").onclick=async()=>{
    const name="garagem-"+today()+".json",blob=new Blob([JSON.stringify({app:"garagem",version:1,vehicles:S.vehicles,photos:PH})],{type:"application/json"}),f=new File([blob],name,{type:"application/json"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Garagem"});else throw 0;
    }catch(e){
      if(e&&e.name==="AbortError")return;
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
    }
    meta.lastBackup=Date.now();try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(e){}
    d.remove();render();
  };
  d.querySelector("#im").onchange=async e=>{
    try{
      const j=JSON.parse(await e.target.files[0].text());if(j.app!=="garagem"||!Array.isArray(j.vehicles))throw 0;
      if(!confirm("Substituir todos os dados deste telemóvel pelos do ficheiro?"))return;
      Object.keys(PH).forEach(k=>delete PH[k]);Object.assign(PH,j.photos||{});S.vehicles=j.vehicles;S.sel=null;
      await tx("photos","readwrite",s=>{s.clear();Object.entries(PH).forEach(([k,v])=>s.put(v,k))});
      await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=cj(S.vehicles);
      d.remove();render();
    }catch(x){alert("Ficheiro inválido.")}
  };
}
render();init();
</script>
</body>
</html>
