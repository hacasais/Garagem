<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RLTecAuto</title><meta name="theme-color" content="#102E2C">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0EE;--card:#FFFFFF;--ink:#151A19;--mut:#5A6462;--line:#D7DBD8;--pri:#102E2C;--pri2:#1A413E;--onpri:#F2F5F3;--warn:#8A5A12;--warnbg:#F2E6CC;--bad:#8C2B22;--badbg:#F3DAD6;--ok:#215C40;--okbg:#D9ECE1;--cut:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1110;--card:#151B1A;--ink:#E7ECE9;--mut:#8C9A96;--line:#273331;--pri:#4E9D93;--pri2:#5CB2A7;--onpri:#07201D;--warn:#D9A748;--warnbg:#302405;--bad:#DD7C70;--badbg:#341613;--ok:#6FC79B;--okbg:#102A1C}}
:root[data-theme="dark"]{--bg:#0C1110;--card:#151B1A;--ink:#E7ECE9;--mut:#8C9A96;--line:#273331;--pri:#4E9D93;--pri2:#5CB2A7;--onpri:#07201D;--warn:#D9A748;--warnbg:#302405;--bad:#DD7C70;--badbg:#341613;--ok:#6FC79B;--okbg:#102A1C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
.num{font-family:"JetBrains Mono","Space Grotesk",monospace;font-weight:600;margin:0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:2px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);padding:12px 20px 12px 16px;font-weight:600;min-height:44px;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line);clip-path:none;border-radius:2px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;clip-path:none;border-radius:2px}
.btn.del{background:transparent;color:var(--bad);border:1.5px solid var(--bad);clip-path:none;border-radius:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.top h1{font-size:26px;display:flex;align-items:center;gap:10px}
.brand{width:30px;height:30px;flex:none;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:700 13px/1 "Space Grotesk",sans-serif;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,0 100%)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;background:#fff;color:#14181a;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:18px;letter-spacing:.06em}
.plate i{background:#1E3A5F;color:#fff;font-style:normal;font-size:10px;padding:2px 5px;display:flex;align-items:flex-end}
.plate b{padding:1px 10px;font-weight:600}
.veh{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:2px;padding:12px;margin-bottom:10px;cursor:pointer}.vtop{display:flex;gap:12px;align-items:center}.chev{font-size:26px;color:var(--mut)}.vsum{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.arow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;font-weight:500;font-size:14px}#bn{display:none;position:sticky;top:0;z-index:8;background:var(--badbg);color:var(--bad);padding:8px 12px;font-size:14px;text-align:center}
.thumb{width:60px;height:60px;border-radius:2px;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mut);font-size:24px}
.veh h2{font-size:19px}
.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;padding:0}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--pri);border-bottom-color:var(--pri)}
.hero{background:var(--pri);background-image:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);padding:18px 20px;display:flex;gap:14px;align-items:center}
.hero .num{font-size:44px;line-height:1}
.hero .thumb{background:rgba(255,255,255,.16);color:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px}
.stat .num{font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:2px;padding:3px 9px;background:var(--line);letter-spacing:.01em}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos img{width:60px;height:60px;object-fit:cover;border-radius:2px;cursor:zoom-in;border:1px solid var(--line)}
.filechip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:6px 10px;font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.predcard{background:var(--bg);border:1.5px dashed var(--line);border-radius:2px;padding:12px;margin-bottom:10px}
.predbadge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--mut);border:1px solid var(--mut);border-radius:2px;padding:2px 6px;text-transform:uppercase;vertical-align:middle}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 2px 10px rgba(0,0,0,.25);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);border-radius:2px;padding:14px 22px}
.sheet{position:fixed;inset:0;background:rgba(10,14,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet form,.sheet .box{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:10px 10px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--pri)}
body{overscroll-behavior-y:contain}
main{overscroll-behavior:contain}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--ink)}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:2px;padding:10px 12px;min-height:44px;font-size:15px}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:28px 12px;border:1.5px dashed var(--line);border-radius:2px}
details.card summary{cursor:pointer;font-weight:600;color:var(--pri);list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";float:right;transform:rotate(90deg);display:inline-block;transition:transform .15s}
details.card[open] summary::after{transform:rotate(270deg)}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}#lb img{max-width:96%;max-height:90%;border-radius:4px}
</style>
</head>
<body>
<div id="bn" role="alert"></div><main id="app"></main>
<div id="lb" onclick="this.style.display='none'"><img alt="Fotografia ampliada"></div>
<script>
const TYPES=["Revisão","Óleo e filtros","Pneus","Rotação de pneus","Travões","Bateria","Inspeção (IPO)","Seguro","Reparação","Alteração / extra","Lavagem / estética","Combustível","Outro"];
const ASSETS=true,PH={},removed=new Set();
let S={vehicles:[],sel:null,tab:"resumo"},LOAD="loading",lastJ="",meta={},q=Promise.resolve();
const cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort()):v);
const idb=new Promise((res,rej)=>{const r=indexedDB.open("garagem",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(store,mode);const o=fn(t.objectStore(store));t.oncomplete=()=>res(o&&o.result);t.onerror=t.onabort=()=>rej(t.error)})}
function banner(m,ok){const b=document.getElementById("bn");b.textContent=m;b.style.display=m?"block":"none";b.style.background=ok?"var(--okbg)":"var(--badbg)";b.style.color=ok?"var(--ok)":"var(--bad)"}
function save(){q=q.then(persist)}
// Recolhe todas as strings que aparecem nos dados (ids de anexos incluídos, em registos, plano, avisos, detalhe técnico, foto do ativo...).
// Um anexo só é considerado "sem uso" se o seu id não aparecer em lado nenhum.
function usedIds(){
  const used=new Set();
  (function walk(x){
    if(typeof x==="string")used.add(x);
    else if(Array.isArray(x))x.forEach(walk);
    else if(x&&typeof x==="object")Object.values(x).forEach(walk);
  })(S.vehicles);
  return used;
}
// O ficheiro JSON é a fonte de verdade dos anexos: se a cópia interna não tiver alguma imagem, vai buscá-la ao ficheiro.
async function restorePhotosFromFile(){
  try{
    if(!window.Android||!Android.hasFile())return false;
    const j=JSON.parse(Android.readFile());
    if(!j||j.app!=="garagem"||!j.photos)return false;
    const used=usedIds(),add=[];
    for(const [k,v] of Object.entries(j.photos)){if(!PH[k]&&used.has(k)){PH[k]=v;add.push([k,v])}}
    if(add.length)await tx("photos","readwrite",st=>{add.forEach(([k,v])=>st.put(v,k))});
    return add.length>0;
  }catch(e){return false}
}
async function persist(){
  if(LOAD!=="ok")return;
  try{
    const j=cj(S.vehicles);if(j===lastJ)return;
    await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=j;meta.changed=Date.now();await tx("kv","readwrite",s=>s.put(meta,"meta"));fileSync();
    const used=usedIds();
    const dead=Object.keys(PH).filter(k=>!used.has(k));
    if(dead.length){await tx("photos","readwrite",s=>{dead.forEach(k=>s.delete(k))});dead.forEach(k=>delete PH[k])}
    banner("");
  }catch(e){banner("Não foi possível guardar neste telemóvel. Exporta já uma cópia de segurança.")}
}
async function applyData(j){Object.keys(PH).forEach(k=>delete PH[k]);Object.assign(PH,j.photos||{});S.vehicles=j.vehicles;S.sel=null;await tx("photos","readwrite",s=>{s.clear();Object.entries(PH).forEach(([k,v])=>s.put(v,k))});await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=cj(S.vehicles)}

// --- Ficheiro de dados no Android: a app grava sempre no mesmo ficheiro que o utilizador escolheu ---
let fsT=null;
function fileSync(now){
  if(!window.Android||!Android.hasFile())return;
  clearTimeout(fsT);
  fsT=setTimeout(()=>{
    try{
      const ok=Android.saveFile(JSON.stringify({app:"garagem",version:1,saved:new Date().toISOString(),vehicles:S.vehicles,photos:PH}));
      if(ok){meta.lastBackup=Date.now();tx("kv","readwrite",s=>s.put(meta,"meta")).catch(()=>{});banner("Guardado no ficheiro às "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}),true);setTimeout(()=>banner(""),2000)}
      else banner("Não foi possível escrever no ficheiro. Escolhe-o outra vez em Cópia.");
    }catch(e){banner("Erro ao escrever no ficheiro.")}
  },now?0:600);
}
async function loadFromFile(say,d){
  try{
    const j=JSON.parse(Android.readFile());
    if(j.app!=="garagem"||!Array.isArray(j.vehicles))throw 0;
    if(!confirm("Substituir os dados da app pelos do ficheiro?"))return;
    await applyData(j);d.remove();render();
  }catch(e){say("Ficheiro vazio ou inválido.")}
}
window.onAndroidFile=async mode=>{
  document.querySelectorAll(".sheet").forEach(s=>s.remove());
  if(mode==="create"){fileSync(true);render();return}
  try{
    const txt=Android.readFile();let j=null;try{j=JSON.parse(txt)}catch(e){}
    if(j&&j.app==="garagem"&&Array.isArray(j.vehicles)){
      if(confirm("O ficheiro tem "+j.vehicles.length+" ativo(s). Carregar os dados do ficheiro para a app?\n\nOK = carregar.\nCancelar = manter os dados atuais e substituir o conteúdo do ficheiro.")){await applyData(j);render();return}
      if(!confirm("Substituir o conteúdo do ficheiro pelos dados atuais da app?")){Android.clearFile();render();return}
    }else if(txt.trim()&&!confirm("Este ficheiro não é da Garagem. Substituir o conteúdo?")){Android.clearFile();render();return}
    fileSync(true);render();
  }catch(e){banner("Não foi possível ler o ficheiro.")}
};

async function autoBackup(){
  if(window.Android||!S.vehicles.length)return;
  if(meta.auto!==true)return;
  const data=JSON.stringify({app:"garagem",version:1,saved:new Date().toISOString(),vehicles:S.vehicles,photos:PH});
  const stamp=()=>{meta.lastBackup=Date.now();tx("kv","readwrite",s=>s.put(meta,"meta")).catch(()=>{})};
  if(fh){
    try{
      if(await fh.queryPermission({mode:"readwrite"})!=="granted"&&await fh.requestPermission({mode:"readwrite"})!=="granted")throw 0;
      const w=await fh.createWritable();await w.write(data);await w.close();stamp();return;
    }catch(e){banner("Não consegui atualizar o ficheiro escolhido. Foi descarregada uma cópia nova.")}
  }
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="garagem-dados-"+today()+".json";document.body.appendChild(a);a.click();a.remove();stamp();
  }catch(e){banner("Não foi possível criar o ficheiro de cópia.")}
}
async function init(){
  try{
    S.vehicles=(await tx("kv","readonly",s=>s.get("vehicles")))||[];lastJ=cj(S.vehicles);
    meta=(await tx("kv","readonly",s=>s.get("meta")))||{};
    try{fh=(await tx("kv","readonly",s=>s.get("fh")))||null}catch(e){}
    const d=await idb;
    await new Promise(res=>{const c=d.transaction("photos").objectStore("photos").openCursor();c.onsuccess=()=>{const u=c.result;if(u){PH[u.key]=u.value;u.continue()}else res()};c.onerror=()=>res()});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    await restorePhotosFromFile();
    LOAD="ok";render();
  }catch(e){LOAD="off";render()}
}
const bkNote=()=>{
  if(!S.vehicles.length)return"";
  if(window.Android)return Android.hasFile()?"":`<div class="card" style="background:var(--warnbg)"><strong>Ainda não escolheste o ficheiro de dados</strong><div class="mut">Sem isto, os teus registos não ficam gravados fora da app.</div><div class="acts" style="margin-top:8px"><button class="btn sm" onclick="backup()">Escolher ficheiro</button></div></div>`;
  const lb=meta.lastBackup||0,pend=!lb||((meta.changed||0)>lb&&Date.now()-lb>7*864e5);
  return pend?`<div class="card" style="background:var(--warnbg)"><strong>Há alterações sem cópia de segurança</strong><div class="mut">${lb?"Última cópia: "+new Date(lb).toLocaleDateString("pt-PT"):"Ainda não guardaste nenhuma cópia."}</div><div class="acts" style="margin-top:8px"><button class="btn sm" onclick="backup()">Guardar cópia</button></div></div>`:"";
};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmtKm=n=>(Number(n)||0).toLocaleString("pt-PT")+" km";
const UNIT_SUFFIX={km:" km",horas:" h",none:""};
const UNIT_NAME={km:"Quilómetros",horas:"Horas",none:"Sem contador (só por tempo)"};
const unitOf=v=>v.unit||"km";
const fmtCounter=v=>{const u=unitOf(v);return u==="none"?"—":(Number(v.km)||0).toLocaleString("pt-PT")+UNIT_SUFFIX[u]};
const fmtCounterN=(n,u)=>(Number(n)||0).toLocaleString("pt-PT")+(UNIT_SUFFIX[u]||" km");
const fmtEur=n=>(Number(n)||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const fmtD=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-PT"):"";
const today=()=>new Date().toISOString().slice(0,10);
const cur=()=>S.vehicles.find(v=>v.id===S.sel);

function alertInfo(a,v){
  let days=a.date?Math.round((new Date(a.date+"T12:00")-new Date(today()+"T12:00"))/864e5):null;
  let kmL=a.km?Number(a.km)-Number(v.km||0):null;
  let lvl=0,txt=[];
  if(days!==null){txt.push(days<0?`há ${-days} dias`:days===0?"hoje":`em ${days} dias`);if(days<0)lvl=2;else if(days<=30)lvl=Math.max(lvl,1)}
  if(kmL!==null){
    const u=unitOf(v);
    txt.push(kmL<=0?`passou ${fmtCounterN(-kmL,u)}`:`faltam ${fmtCounterN(kmL,u)}`);
    if(kmL<=0)lvl=2;else if(kmL<=1000)lvl=Math.max(lvl,1);
    if(days===null&&kmL>0){
      const ann=annualKm(v);
      if(ann&&ann.avgPerYear>0){
        const dt=new Date();dt.setDate(dt.getDate()+Math.round(kmL/ann.avgPerYear*365));
        txt.push("previsão "+dt.toLocaleDateString("pt-PT",{month:"short",year:"numeric"}));
      }
    }
  }
  return{lvl,days,kmL,txt:txt.join(" · "),score:lvl*1e6-(days??999)}
}
function render(){
  if(LOAD==="loading"){$("#app").innerHTML=`<div class="empty">A carregar a tua garagem…</div>`;return}
  if(LOAD==="off"){$("#app").innerHTML=`<div class="empty">Este browser não permite guardar dados locais.<br>Abre o ficheiro com o Chrome (Android) ou o Safari (iPhone), fora do modo privado.</div>`;return}
  save();
  const v=cur();
  $("#app").innerHTML=v?vehicleView(v):listView();
}
const src=p=>p?(PH[p]||""):"";
const thumb=v=>v.photo?`<img class="thumb" src="${src(v.photo)}" alt="">`:`<div class="thumb">🚗</div>`;
const near=(a,v)=>{const i=alertInfo(a,v);return((i.days!==null&&i.days<=60)||(i.kmL!==null&&i.kmL<=2000))?i:null};
const openV=id=>{S.sel=id;S.tab="resumo";render()};
let heroStartX=null,heroStartY=null;
function heroTouchStart(e){const t=e.touches[0];heroStartX=t.clientX;heroStartY=t.clientY}
function heroTouchEnd(e){
  if(heroStartX==null)return;
  const t=e.changedTouches[0],dx=t.clientX-heroStartX,dy=t.clientY-heroStartY;
  heroStartX=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy))return;
  const ids=S.vehicles.map(x=>x.id),i=ids.indexOf(S.sel);if(i<0||ids.length<2)return;
  S.sel=ids[dx<0?(i+1)%ids.length:(i-1+ids.length)%ids.length];
  render();
}
function listView(){
  const n=S.vehicles.reduce((s,v)=>s+allAlerts(v).filter(a=>near(a,v)).length,0);
  return `<div class="top"><h1><span class="brand">RT</span>RLTecAuto</h1><div style="display:flex;gap:6px">${S.vehicles.length>1?`<button class="btn ghost sm" onclick="compareAssets()">Comparar</button>`:""}<button class="btn ghost sm" onclick="backup()">Cópia</button></div></div>
  ${bkNote()}
  ${n?`<p class="mut" style="margin:0 0 12px">${n} aviso${n>1?"s":""} nos próximos 2 meses (ou a menos de 2 000 km)</p>`:""}
  ${S.vehicles.length?S.vehicles.map(vcard).join(""):`<div class="empty">Ainda não tens nenhum ativo.<br>Adiciona o primeiro para começar a registar.</div>`}
  <button class="btn fab" onclick="editVeh()">+ Ativo</button>`;
}
function vcard(v){
  const l=allAlerts(v).map(a=>({a,i:near(a,v)})).filter(x=>x.i).sort((x,y)=>y.i.score-x.i.score);
  const yr=String(new Date().getFullYear()),cost=(v.records||[]).filter(r=>(r.date||"").startsWith(yr)).reduce((s,r)=>s+(Number(r.cost)||0),0);
  return `<div class="veh" role="button" tabindex="0" onclick="openV('${v.id}')" onkeydown="if(event.key==='Enter')openV('${v.id}')">
  <div class="vtop">${thumb(v)}<div style="flex:1;min-width:0"><h2>${esc(v.name)}</h2><div class="mut">${v.year?esc(v.year)+" · ":""}${unitOf(v)!=="none"?fmtCounter(v)+" · ":""}${fmtEur(cost)} em ${yr}</div>${v.plate?plate(v.plate):""}</div><span class="chev">›</span></div>

// Para cada tipo de registo, olha para a última ocorrência (ainda "em serviço") e compara
// o tempo/km já passados com a duração média das trocas anteriores do mesmo tipo+marca.
function predictedAlerts(v){
  const groups=groupLifespans(partLifespans(v));
  const byKey={};groups.forEach(g=>{byKey[g.type+"||"+g.brand]=g});
  const latest={};
  (v.records||[]).forEach(r=>{if(r.type&&r.date&&(!latest[r.type]||r.date>latest[r.type].date))latest[r.type]=r});
  const out=[];
  Object.values(latest).forEach(last=>{
    const brand=(last.brand||"").trim()||"—";
    const g=byKey[last.type+"||"+brand];
    if(!g)return;
    const daysSince=Math.round((new Date(today()+"T12:00")-new Date(last.date+"T12:00"))/864e5);
    const kmSince=Number(last.km)>0&&unitOf(v)!=="none"?(Number(v.km)||0)-Number(last.km):null;
    const kmRatio=g.avgKm&&kmSince!=null?kmSince/g.avgKm:null;
    const dayRatio=g.avgDays?daysSince/g.avgDays:null;
    const ratio=Math.max(kmRatio||0,dayRatio||0);
    if(ratio<0.7)return;
    out.push({type:last.type,brand,g,daysSince,kmSince,ratio,lvl:ratio>=1?2:1});
  });
  return out.sort((a,b)=>b.ratio-a.ratio);
}
function predCard(p,v){
  const u=unitOf(v);
  const parts=[];
  if(p.kmSince!=null&&p.g.avgKm)parts.push(`${fmtCounterN(p.kmSince,u)} de ${fmtCounterN(p.g.avgKm,u)} habituais`);
  parts.push(`${fmtDays(p.daysSince)} de ${fmtDays(p.g.avgDays)} habituais`);
  return `<div class="predcard"><div class="row"><div><span class="predbadge">Previsão</span> <strong style="margin-left:2px">${esc(p.type)}</strong><div class="mut" style="margin-top:2px">${p.brand!=="—"?esc(p.brand):"Sem marca/modelo"}</div></div></div>
  <div class="mut" style="margin-top:6px">${p.ratio>=1?"Já passou a duração habitual":"A aproximar-se da duração habitual"}</div>
  <div class="mut" style="margin-top:2px;font-size:12px">${parts.join(" · ")} · baseado em ${p.g.n} troca${p.g.n>1?"s":""} anterior${p.g.n>1?"es":""}</div></div>`;
}

async function shrink(file){
  return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);res(c.toDataURL("image/jpeg",.7))};im.onerror=()=>res(null);im.src=URL.createObjectURL(file)});
}
async function readDoc(file){
  if(file.size>8*1024*1024)return null;
  return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(file)});
}
// Guarda fotografias (reduzidas) e documentos (tal como estão). Cada anexo fica como {id,name,mime}.
async function files(form,name){
  const out=[];
  for(const f of form.querySelector(`[name=${name}]`).files){
    const isImg=f.type.startsWith("image/");
    const u=isImg?await shrink(f):await readDoc(f);
    if(!u){banner('Não foi possível guardar "'+f.name+'" (talvez seja grande demais).');continue}
    const id=uid()+uid();PH[id]=u;
    try{await tx("photos","readwrite",s=>s.put(u,id));out.push({id,name:f.name,mime:isImg?"image/jpeg":(f.type||"application/octet-stream")})}
    catch(e){delete PH[id];banner('Não foi possível guardar "'+f.name+'".')}
  }
  return out;
}

// --- Relatórios (por ativo) ---
// Estima o contador percorrido por ano a partir dos pontos conhecidos (registos + valor atual),
// distribuindo proporcionalmente entre duas leituras pelos dias de cada ano civil.
function annualKm(v){
  if(unitOf(v)==="none")return null;
  const byDate={};
  (v.records||[]).forEach(r=>{if(Number(r.km)>0&&r.date){if(!byDate[r.date]||r.km>byDate[r.date])byDate[r.date]=Number(r.km)}});
  (v.kmLog||[]).forEach(e=>{if(Number(e.km)>0&&e.date){if(!byDate[e.date]||e.km>byDate[e.date])byDate[e.date]=Number(e.km)}});
  byDate[today()]=Math.max(byDate[today()]||0,Number(v.km)||0);
  const arr=Object.entries(byDate).map(([d,k])=>({d,k})).sort((a,b)=>a.d.localeCompare(b.d));
  if(arr.length<2||arr[arr.length-1].k<=arr[0].k)return null;
  // Distribui os km percorridos entre duas leituras proporcionalmente aos dias de cada ano civil.
  // Anos sem nenhuma leitura própria (nem registo nem atualização de contador) ficam marcados
  // como estimados — o valor existe, mas é calculado por interpolação, não medido diretamente.
  const realYears=new Set(arr.map(p=>p.d.slice(0,4)));
  const years={};
  for(let i=1;i<arr.length;i++){
    const a=arr[i-1],b=arr[i],dkm=b.k-a.k;if(dkm<=0)continue;
    const d0=new Date(a.d+"T12:00"),d1=new Date(b.d+"T12:00"),totalDaysSeg=Math.max(1,(d1-d0)/864e5);
    let cur=new Date(d0);
    while(cur<d1){
      const yEnd=new Date(cur.getFullYear(),11,31,23,59,59),segEnd=yEnd<d1?yEnd:d1;
      const segDays=Math.max(0,(segEnd-cur)/864e5),y=cur.getFullYear();
      years[y]=(years[y]||0)+dkm*(segDays/totalDaysSeg);
      cur=new Date(segEnd.getTime()+36e5);
    }
  }
  Object.keys(years).forEach(y=>years[y]=Math.round(years[y]));
  const estimated={};Object.keys(years).forEach(y=>{estimated[y]=!realYears.has(String(y))});
  const totalKm=arr[arr.length-1].k-arr[0].k;
  const totalDays=Math.max(1,(new Date(arr[arr.length-1].d+"T12:00")-new Date(arr[0].d+"T12:00"))/864e5);
  return{years,estimated,avgPerYear:Math.round(totalKm/(totalDays/365)),totalKm,totalDays};
}

function costStats(v){
  const total=(v.records||[]).reduce((s,r)=>s+(Number(r.cost)||0),0);
  const byYear={};
  (v.records||[]).forEach(r=>{const y=(r.date||"").slice(0,4);if(y)byYear[y]=(byYear[y]||0)+(Number(r.cost)||0)});
  const nYears=Object.keys(byYear).length||1;
  const ann=annualKm(v);
  return{total,avgYear:total/nYears,perKm:ann&&ann.totalKm>0?total/ann.totalKm:null,byYear};
}
// Duração entre substituições sucessivas do mesmo tipo, dentro deste ativo, agrupadas por tipo+marca/modelo.
function partLifespans(v){
  // Um intervalo entre duas substituições seguidas mede quanto durou a PEÇA ANTERIOR (a),
  // não a que acabou de entrar (b) — essa ainda não tem substituição a seguir, logo não conta ainda.
  const rows=[],byType={};
  (v.records||[]).forEach(r=>{if(r.type&&r.date)(byType[r.type]=byType[r.type]||[]).push(r)});
  Object.values(byType).forEach(list=>{
    const sorted=[...list].sort((a,b)=>a.date.localeCompare(b.date)||(a.km||0)-(b.km||0));
    for(let i=1;i<sorted.length;i++){
      const a=sorted[i-1],b=sorted[i];
      if(b.oneOff)continue; // esta troca não representa desgaste normal — não entra nas médias
      const days=Math.round((new Date(b.date+"T12:00")-new Date(a.date+"T12:00"))/864e5);
      if(days<=0)continue;
      const km=Number(b.km)>0&&Number(a.km)>0?Number(b.km)-Number(a.km):null;
      rows.push({type:a.type,brand:(a.brand||"").trim(),km:km>0?km:null,days,from:a.date,to:b.date});
    }
  });
  return rows;
}
function groupLifespans(rows){
  const g={};
  rows.forEach(r=>{(g[r.type+"||"+(r.brand||"—")]=g[r.type+"||"+(r.brand||"—")]||[]).push(r)});
  return Object.entries(g).map(([key,list])=>{
    const[type,brand]=key.split("||"),kms=list.filter(x=>x.km!=null).map(x=>x.km);
    return{type,brand,n:list.length,rows:list,
      avgKm:kms.length?Math.round(kms.reduce((s,x)=>s+x,0)/kms.length):null,
      avgDays:Math.round(list.reduce((s,x)=>s+x.days,0)/list.length)};
  }).sort((a,b)=>a.type.localeCompare(b.type,"pt")||(b.avgKm||0)-(a.avgKm||0));
}

  const v=cur();document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const pa=Object.fromEntries(planAlerts(v).map(a=>[a.planId,a]));
  sheet(`<h2>Plano de manutenção</h2><p class="mut">Define de quanto em quanto tempo ou km se faz cada intervenção. Os avisos calculam-se sozinhos a partir do último registo desse tipo. Os valores são sugestões: ajusta-os ao manual do fabricante.</p>
  ${[...v.plan].sort((a,b)=>a.type.localeCompare(b.type,"pt")).map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.type)}</strong><div class="mut">${[p.km?"cada "+fmtCounterN(p.km,unitOf(v)):"",p.months?"cada "+p.months+" meses":""].filter(Boolean).join(" · ")||"Sem intervalo"}</div>${pa[p.id]&&pa[p.id].none?`<div class="mut">Sem histórico: regista a última vez ou indica-a ao editar.</div>`:""}</div><button type="button" class="btn ghost sm" onclick="editPlan('${p.id}')">Editar</button></div></div>`).join("")}
  <div class="acts"><button type="button" class="btn ghost" data-close>Fechar</button><button type="button" class="btn" onclick="editPlan()">+ Intervenção</button></div>`,()=>{});
}
function editPlan(id){
  const v=cur();document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const p=(v.plan||[]).find(x=>x.id===id)||{};
  const u=unitOf(v),hasCounter=u!=="none";
  const mode0=!hasCounter?"meses":(p.km&&p.months?"ambos":p.months?"meses":"km");
  const modeRow=(val,label)=>`<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="radio" name="mode" value="${val}" ${mode0===val?"checked":""} style="width:20px;min-height:0" onchange="document.querySelectorAll('.pkm').forEach(e=>e.style.display=(this.value==='km'||this.value==='ambos')?'':'none');document.querySelectorAll('.pmo').forEach(e=>e.style.display=(this.value==='meses'||this.value==='ambos')?'':'none')"> ${label}</label>`;
  sheet(`<h2>${id?"Editar intervenção":"Nova intervenção"}</h2>
  <div class="row" style="align-items:baseline"><label style="margin:0">Nome da intervenção</label><button type="button" class="btn ghost sm" style="padding:2px 10px;min-height:0" onclick="manageTypes()">Gerir lista</button></div>
  <input name="type" required list="typelist" placeholder="Ex.: Óleo do diferencial" value="${esc(p.type||"")}">
  <datalist id="typelist">${allTypes().map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
  ${hasCounter?`<label style="margin-top:14px">Controlar por</label>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">${modeRow("km",UNIT_NAME[u])}${modeRow("meses","Tempo")}${modeRow("ambos","Ambos")}</div>`:""}
  <div class="g2" style="margin-top:10px">
  <div class="pkm" style="display:${!hasCounter||mode0==="meses"?"none":""}"><label>A cada (${u==="horas"?"horas":"km"})</label><input name="km" type="number" inputmode="numeric" min="0" value="${p.km||""}"></div>
  <div class="pmo" style="display:${hasCounter&&mode0==="km"?"none":""}"><label>A cada (meses)</label><input name="months" type="number" inputmode="numeric" min="0" value="${p.months||""}"></div>
  </div>
  ${hasCounter?`<p class="mut">Com "Ambos", o aviso dispara com o que chegar primeiro.</p>`:""}
  <label>Última vez (só se ainda não tens registo)</label><div class="g2"><input name="lastDate" type="date" value="${p.lastDate||""}">${hasCounter?`<input name="lastKm" type="number" inputmode="numeric" placeholder="${u==="horas"?"horas":"km"}" value="${p.lastKm||""}">`:""}</div>
  <label>Lembrete para a próxima vez (opcional)</label><input name="note" placeholder="Ex.: rever nível das pastilhas de travão" value="${esc(p.note||"")}">
  <p class="mut">Só vale para a próxima vez: aparece junto deste aviso, passa para as notas do registo quando tocares em «Concluir», e depois limpa-se sozinho — não se repete nas vezes seguintes.</p>
  <label>Anexos (fotografia ou documento — ex.: manual, folheto da peça)</label>
  ${id&&(p.photos||[]).length?`<div class="acts" style="margin-top:4px"><button type="button" class="btn ghost sm" onclick="managePlanAtt('${id}')">Gerir ${p.photos.length} anexo${p.photos.length>1?"s":""}</button></div>`:""}
  <input name="att" type="file" accept="image/*,application/pdf" multiple>
  <div class="acts"><button type="button" class="btn ghost" onclick="planSheet()">Cancelar</button><button class="btn">Guardar</button></div>
  ${id?`<div class="acts"><button type="button" class="btn del" onclick="delPlan('${id}')">Apagar intervenção</button></div>`:""}`,
  async(f,form)=>{const mode=hasCounter?f.get("mode"):"meses",name=(f.get("type")||"").trim();if(!name)return;
    const km=hasCounter&&mode!=="meses"?Number(f.get("km"))||0:0,months=mode!=="km"?Number(f.get("months"))||0:0;
    if(!km&&!months){alert("Indica "+(hasCounter?(u==="horas"?"horas, meses ou ambos.":"km, meses ou ambos."):"os meses.")); setTimeout(()=>editPlan(id),50);return}
    const novos=await files(form,"att");
    const o=id?p:{id:uid(),photos:[]};
    Object.assign(o,{type:name,km,months,lastDate:f.get("lastDate"),lastKm:Number(f.get("lastKm"))||0,note:(f.get("note")||"").trim()});
    o.photos=[...(o.photos||[]),...novos];
    if(!id){v.plan=v.plan||defPlan();v.plan.push(o)}setTimeout(planSheet,50)});
}
function delPlan(id){const v=cur();v.plan=v.plan.filter(p=>p.id!==id);render();planSheet()}
function zoom(s){const l=$("#lb");l.querySelector("img").src=s;l.style.display="grid"}
function backup(){
  const last=meta.lastBackup?new Date(meta.lastBackup).toLocaleDateString("pt-PT")+" "+new Date(meta.lastBackup).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}):"nunca";
  const hasFile=window.Android&&Android.hasFile();
  const d=sheet(`<h2>Cópia de segurança</h2>
  ${window.Android?`
  <p class="mut">A app grava sempre no ficheiro que escolheres aqui — sem criar ficheiros novos a cada vez. Escolhe-o uma vez; se mudares de telemóvel, copia esse ficheiro para o novo e escolhe-o aqui de novo.</p>
  <p><strong>Ficheiro:</strong> ${hasFile?esc(Android.fileName()||"(sem nome)"):"nenhum escolhido"}</p>
  <div class="acts"><button type="button" class="btn" id="afn">Criar ficheiro novo</button><button type="button" class="btn ghost" id="afo">Escolher existente</button></div>
  ${hasFile?`<div class="acts"><button type="button" class="btn ghost" id="afs">Guardar agora</button><button type="button" class="btn ghost" id="afl">Carregar do ficheiro</button></div>`:""}
  <div id="amsg" class="mut" style="margin-bottom:8px"></div>
  <p class="mut">Última gravação: <strong>${last}</strong></p>
  <h3 style="margin:14px 0 4px">Cópia manual</h3>
  <p class="mut">Além do ficheiro acima, podes exportar uma cópia à parte a qualquer momento (para o Drive, email, computador…).</p>`
  :`<p class="mut">Os dados ficam guardados neste dispositivo. Exporta uma cópia de vez em quando.</p><p class="mut">Última cópia: <strong>${last}</strong></p>`}
  <div class="acts"><button type="button" class="btn${window.Android?" ghost":""}" id="ex">Guardar / partilhar cópia</button></div>
  <label>Importar cópia (substitui os dados atuais)</label><input type="file" id="im" accept=".json,application/json">
  <div class="acts"><button type="button" class="btn ghost" data-close>Fechar</button></div>`,()=>{});
  if(window.Android){
    const say=x=>{const el=d.querySelector("#amsg");if(el)el.textContent=x};
    d.querySelector("#afn").onclick=()=>Android.createFile();
    d.querySelector("#afo").onclick=()=>Android.pickFile();
    d.querySelector("#afs")?.addEventListener("click",()=>{fileSync(true);say("A gravar…")});
    d.querySelector("#afl")?.addEventListener("click",()=>loadFromFile(say,d));
  }
  d.querySelector("#ex").onclick=async()=>{
    const name="garagem-"+today()+".json",blob=new Blob([JSON.stringify({app:"garagem",version:1,vehicles:S.vehicles,photos:PH})],{type:"application/json"}),f=new File([blob],name,{type:"application/json"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Garagem"});else throw 0;
    }catch(e){
      if(e&&e.name==="AbortError")return;
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
    }
    meta.lastBackup=Date.now();try{await tx("kv","readwrite",s=>s.put(meta,"meta"))}catch(e){}
    d.remove();render();
  };
  d.querySelector("#im").onchange=async e=>{
    try{
      const j=JSON.parse(await e.target.files[0].text());if(j.app!=="garagem"||!Array.isArray(j.vehicles))throw 0;
      if(!confirm("Substituir todos os dados deste telemóvel pelos do ficheiro?"))return;
      Object.keys(PH).forEach(k=>delete PH[k]);Object.assign(PH,j.photos||{});S.vehicles=j.vehicles;S.sel=null;
      await tx("photos","readwrite",s=>{s.clear();Object.entries(PH).forEach(([k,v])=>s.put(v,k))});
      await tx("kv","readwrite",s=>s.put(S.vehicles,"vehicles"));lastJ=cj(S.vehicles);
      d.remove();render();
    }catch(x){alert("Ficheiro inválido.")}
  };
}
render();init();
</script>
</body>
